<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101923">
<title>D2R · Documentación de ingeniería</title>
<style>
:root{color-scheme:light;--ink:#172536;--muted:#66788b;--line:#d7e0e8;--accent:#e87928;--paper:#fff;--canvas:#eef2f5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.68 Inter,"Segoe UI",Arial,sans-serif}
a{color:#165d91;text-decoration-thickness:1px;text-underline-offset:3px}a:hover{color:#b45112}
#localToolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100vw - 1060px)/2));background:#101923;color:#eef3f8;border-bottom:3px solid var(--accent)}
#localToolbar strong{color:#f4f6f9;letter-spacing:.04em}#localToolbar small{display:block;color:#a7b8c8;font-size:10px;letter-spacing:.12em}
.language-switch{display:flex;gap:3px;padding:3px;border:1px solid #53687c;border-radius:8px;background:#182635}.language-switch button{min-width:38px;padding:7px 9px;border:0;border-radius:5px;background:transparent;color:#b8c7d5;font-weight:800;cursor:pointer}.language-switch button[aria-pressed="true"]{background:var(--accent);color:#101923}
.layout{max-width:1060px;margin:24px auto;padding:0 18px}article{min-width:0;padding:clamp(22px,5vw,52px);border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 8px 28px #1a2a3910}
h1{margin:0 0 20px;color:#142337;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.03em}h2{margin:36px 0 12px;padding-top:18px;border-top:1px solid #e6ebef;color:#1a3046;font-size:22px;line-height:1.3}h3{margin:26px 0 9px;font-size:18px}p{margin:0 0 15px}strong{color:#263b50}
blockquote{margin:18px 0;padding:13px 17px;border-left:4px solid var(--accent);border-radius:0 8px 8px 0;background:#fff6ef;color:#536679}ul,ol{margin:8px 0 19px;padding-left:25px}li{padding:2px 0 3px 3px}code{padding:2px 5px;border-radius:4px;background:#edf1f4;font:.88em ui-monospace,SFMono-Regular,Consolas,monospace;white-space:normal;overflow-wrap:anywhere}pre{overflow:auto;padding:14px;border-radius:8px;background:#142334;color:#eef3f8;line-height:1.5}pre code{padding:0;background:transparent;color:inherit;white-space:pre}
.table-wrap{overflow-x:auto;margin:14px 0 21px}table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.5}th{text-align:left;background:#21364a;color:#fff;padding:10px 11px;font-size:11px;letter-spacing:.025em}td{padding:9px 11px;border-bottom:1px solid #e0e7ed;vertical-align:top}tbody tr:nth-child(even){background:#f5f8fa}.doc-error{padding:16px;border:1px solid #e8b09c;border-radius:8px;background:#fff3ed;color:#7a3520}
.embedded #localToolbar{display:none}.embedded .layout{margin:0 auto;padding:16px 18px}.embedded article{box-shadow:none}
@media(max-width:700px){#localToolbar{padding:9px 12px}.layout{margin:12px auto;padding:0 10px}article{padding:22px 17px}h2{font-size:20px;margin-top:29px}.table-wrap{overflow:visible}table,tbody{display:block}thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}tbody{display:grid;gap:8px}tbody tr{display:block;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff!important}td{display:grid;grid-template-columns:minmax(82px,30%) minmax(0,1fr);gap:8px;padding:9px 10px;overflow-wrap:anywhere}td::before{content:attr(data-label);color:#536a7e;font-size:10px;font-weight:800;line-height:1.4}}
@media print{@page{size:A4;margin:17mm}body{background:#fff;color:#111;font:11pt/1.48 Georgia,"Times New Roman",serif}#localToolbar{display:none!important}.layout{max-width:none;margin:0;padding:0}article{padding:0;border:0;border-radius:0;box-shadow:none}h1{font-size:25pt}h2{font-size:16pt;break-after:avoid;margin-top:22pt}h3{break-after:avoid}p,li{orphans:3;widows:3}blockquote{background:#fff;border:1px solid #aaa;border-left:4px solid #555;break-inside:avoid}table{font-size:9pt}tr{break-inside:avoid}th{background:#eee!important;color:#111;border:1px solid #888}td{border:1px solid #aaa}a{color:#111;text-decoration:none}}
</style>
<script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded')</script>
</head>
<body>
<header id="localToolbar"><a id="readerBack" href="../../index.html" style="color:inherit;text-decoration:none"><strong id="readerBrand">D2R · DOCUMENTACIÓN</strong><small id="readerBrandSub">← VOLVER AL SIMULADOR</small></a><div class="language-switch" role="group" aria-label="Idioma del documento"><button type="button" data-language="es" aria-pressed="true">ES</button><button type="button" data-language="en" aria-pressed="false">EN</button></div></header>
<main class="layout"><article id="content" aria-live="polite"><p>Cargando documento…</p></article></main>
<script>
const catalog={
  '01':{es:{title:'01 · Especificación funcional',file:'01-ESPECIFICACION-FUNCIONAL.md'},en:{title:'01 · Functional specification',file:'01-FUNCTIONAL-SPECIFICATION.en.md'}},
  '02':{es:{title:'02 · Diseño mecánico, eléctrico y neumático',file:'02-DISENO-MECANICO-ELECTRICO-NEUMATICO.md'},en:{title:'02 · Mechanical, electrical, and pneumatic design',file:'02-MECHANICAL-ELECTRICAL-PNEUMATIC-DESIGN.en.md'}},
  '03':{es:{title:'03 · Componentes, hardware y mapa de E/S',file:'03-COMPONENTES-HARDWARE-IO.md'},en:{title:'03 · Components, hardware, and I/O map',file:'03-COMPONENTS-HARDWARE-IO.en.md'}},
  '04':{es:{title:'04 · Safety Engineering',file:'04-SAFETY-ENGINEERING.md'},en:{title:'04 · Safety Engineering',file:'04-SAFETY-ENGINEERING.en.md'}},
  '05':{es:{title:'05 · Arquitectura PLC',file:'05-ARQUITECTURA-PLC.md'},en:{title:'05 · PLC architecture',file:'05-PLC-ARCHITECTURE.en.md'}},
  '06':{es:{title:'06 · Programación, HMI y visión',file:'06-PROGRAMACION-HMI-VISION.md'},en:{title:'06 · Programming, HMI, and vision',file:'06-PROGRAMMING-HMI-VISION.en.md'}},
  '07':{es:{title:'07 · Gestión del proyecto y commissioning',file:'07-PROYECTO-COMMISSIONING-FAT-SAT.md'},en:{title:'07 · Project management and commissioning',file:'07-PROJECT-MANAGEMENT-COMMISSIONING-FAT-SAT.en.md'}}
};
const docId=new URLSearchParams(location.search).get('doc')||'01';
const content=document.getElementById('content');let requestId=0;
window.__d2rMarkdownReader=true;window.__d2rDocumentReady=false;
function escapeHtml(value){return value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function inline(value){let html=escapeHtml(value);const codes=[];html=html.replace(/`([^`]+)`/g,(_,code)=>{const token=`D2RCODE${codes.length}TOKEN`;codes.push(`<code>${code}</code>`);return token});html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>/^(javascript|data):/i.test(url)?label:`<a href="${url.replaceAll('"','&quot;')}">${label}</a>`);html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');codes.forEach((code,index)=>{html=html.replace(`D2RCODE${index}TOKEN`,code)});return html}
function renderMarkdown(markdown){const lines=markdown.replaceAll('\r','').split('\n');const out=[];let listType='';let codeLines=null;const closeList=()=>{if(listType){out.push(`</${listType}>`);listType=''}};for(let i=0;i<lines.length;i++){const line=lines[i];if(line.trim().startsWith('```')){if(codeLines){out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);codeLines=null}else{closeList();codeLines=[]}continue}if(codeLines){codeLines.push(line);continue}if(!line.trim()){closeList();continue}if(/^\s*\|/.test(line)){closeList();const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i].trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim()));i++}i--;const hasSeparator=rows.length>1&&rows[1].every(cell=>/^:?-{3,}:?$/.test(cell));const headers=hasSeparator?rows[0]:null;const body=hasSeparator?rows.slice(2):rows.slice(1);if(headers){out.push('<div class="table-wrap"><table><thead><tr>'+headers.map(cell=>`<th>${inline(cell)}</th>`).join('')+'</tr></thead><tbody>');for(const row of body){out.push('<tr>'+headers.map((header,index)=>`<td data-label="${escapeHtml(header)}">${inline(row[index]||'')}</td>`).join('')+'</tr>')}out.push('</tbody></table></div>')}else{out.push('<p>'+rows.map(row=>inline(row.join(' · '))).join(' · ')+'</p>')}continue}const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){closeList();const level=heading[1].length;out.push(`<h${level}>${inline(heading[2])}</h${level}>`);continue}if(/^\s*---+\s*$/.test(line)){closeList();out.push('<hr>');continue}const quote=line.match(/^>\s?(.*)$/);if(quote){closeList();out.push(`<blockquote><p>${inline(quote[1])}</p></blockquote>`);continue}const bullet=line.match(/^\s*[-*]\s+(.+)$/);const numbered=line.match(/^\s*\d+[.)]\s+(.+)$/);if(bullet||numbered){const nextType=bullet?'ul':'ol';if(listType!==nextType){closeList();out.push(`<${nextType}>`);listType=nextType}out.push(`<li>${inline((bullet||numbered)[1])}</li>`);continue}closeList();out.push(`<p>${inline(line)}</p>`)}closeList();return out.join('\n')}
async function setDocumentLanguage(language){const selected=language==='en'?'en':'es';const doc=catalog[docId]?.[selected];if(!doc){content.innerHTML='<p class="doc-error">Documento no encontrado / Document not found.</p>';return}const current=++requestId;window.__d2rDocumentReady=false;document.documentElement.lang=selected;document.title=doc.title+' · D2R';document.getElementById('readerBrand').textContent=selected==='en'?'D2R · DOCUMENTATION':'D2R · DOCUMENTACIÓN';document.getElementById('readerBrandSub').textContent=selected==='en'?'← BACK TO SIMULATOR':'← VOLVER AL SIMULADOR';document.getElementById('localToolbar').querySelector('[role="group"]').setAttribute('aria-label',selected==='en'?'Document language':'Idioma del documento');document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===selected)));try{const response=await fetch(doc.file,{cache:'no-cache'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const markdown=await response.text();if(current!==requestId)return;content.innerHTML=renderMarkdown(markdown);window.__d2rDocumentReady=true;if(window.parent!==window)window.parent.postMessage({type:'d2r-document-ready',docId,language:selected},location.origin)}catch(error){if(current===requestId)content.innerHTML=`<p class="doc-error">No se pudo cargar el documento. / Could not load the document. <small>${escapeHtml(String(error.message||error))}</small></p>`}return selected}
window.setDocumentLanguage=setDocumentLanguage;
document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>setDocumentLanguage(button.dataset.language)));
let initialLanguage=new URLSearchParams(location.search).get('lang');try{initialLanguage=initialLanguage||localStorage.getItem('d2r-document-language')}catch(error){}
setDocumentLanguage(initialLanguage||'es');
</script>
</body>
</html>

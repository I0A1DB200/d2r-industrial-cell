<rect x="1110" y="615" width="260" height="122" rx="12" fill="#f6f9fa" stroke="#ced8df" stroke-width="2"/>
<text x="1132" y="644" class="label" font-size="17">LEYENDA / LEGEND</text>
<line x1="1135" y1="670" x2="1190" y2="670" class="route"/><text x="1203" y="676" class="small">Flujo de pieza / part flow</text>
<line x1="1135" y1="704" x2="1190" y2="704" class="routeA"/><text x="1203" y="710" class="small">Ruta OK → A / OK route</text>

<line x1="54" y1="800" x2="1384" y2="800" stroke="#d8e0e6" stroke-width="2"/>
<text x="64" y="833" class="small">Base: HTML + documentos 00–04. Coordenadas del modelo son referencias visuales; no son dimensiones de fabricación.</text>

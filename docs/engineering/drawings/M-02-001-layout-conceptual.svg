<rect x="324" y="401" width="802" height="154" rx="20" class="machine"/>
<rect x="345" y="420" width="760" height="116" rx="8" class="belt"/>
<text x="721" y="485" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">CINTA DE INSPECCIÓN / INSPECTION CONVEYOR</text>
<path d="M405 510 H1040" class="route"/>
<text x="700" y="529" text-anchor="middle" font-size="14" fill="#d7e9ec">FLUJO DE PIEZA / PART FLOW  +X</text>

<!-- Feeder -->

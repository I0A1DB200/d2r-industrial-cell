<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto">
<title id="title">M-02-001 · Layout funcional / Functional layout</title>
<desc id="desc">Croquis conceptual bilingüe y no a escala de una célula de inspección; muestra alimentador, cinta, visión, expulsión OK a A, descarga NOK a B y armario.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1e8ca0"/></marker>
  <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#e9832b"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172536}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#56687a}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#526476}.tiny{font-size:13px;fill:#526476}.tag{font-size:14px;font-weight:700;fill:#1e7180}.outline{fill:#fff;stroke:#8b9aaa;stroke-width:3}.machine{fill:#cfd8e0;stroke:#687b8b;stroke-width:3}.belt{fill:#46545d;stroke:#263744;stroke-width:4}.route{fill:none;stroke:#1e8ca0;stroke-width:5;marker-end:url(#arrow)}.routeA{fill:none;stroke:#e9832b;stroke-width:6;marker-end:url(#arrowOrange)}.dash{fill:none;stroke:#718598;stroke-width:3;stroke-dasharray:10 8}
  </style>
</defs>
<rect width="1440" height="900" fill="#f5f8fa"/>
<rect x="24" y="24" width="1392" height="852" rx="18" fill="#fff" stroke="#cad4dc" stroke-width="2"/>
<rect x="24" y="24" width="14" height="852" rx="7" fill="#ed7e27"/>
<text x="64" y="74" class="title">M-02-001 · Layout funcional</text>
<text x="64" y="104" class="subtitle">Functional layout · croquis didáctico / educational sketch · no a escala / not to scale</text>
<rect x="1035" y="46" width="340" height="44" rx="10" fill="#fff2e6" stroke="#ed7e27" stroke-width="2"/>
<text x="1205" y="75" text-anchor="middle" font-size="17" font-weight="700" fill="#9c4b0b">CONCEPTUAL · NO FABRICAR</text>
<line x1="54" y1="126" x2="1384" y2="126" stroke="#d8e0e6" stroke-width="2"/>

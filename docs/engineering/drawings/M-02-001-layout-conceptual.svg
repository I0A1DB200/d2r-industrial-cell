<rect x="264" y="457" width="20" height="30" rx="3" fill="#e9832b" stroke="#8e551d" stroke-width="2"/>
<path d="M284 472 H345" class="route"/>
<text x="186" y="378" text-anchor="middle" class="label">ALIMENTADOR</text>
<text x="186" y="523" text-anchor="middle" class="tiny">1 pieza inferior + hasta 6 arriba</text>
<text x="186" y="542" text-anchor="middle" class="tiny">One bottom part + up to 6 above</text>


<text x="428" y="370" text-anchor="middle" class="tiny">DI</text><text x="753" y="370" text-anchor="middle" class="tiny">DI</text><text x="1020" y="370" text-anchor="middle" class="tiny">DI</text>
<text x="904" y="578" text-anchor="middle" class="tiny">Posiciones de sensores solo orientativas · ubicaciones por verificar</text>


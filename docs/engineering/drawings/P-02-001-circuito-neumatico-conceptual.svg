<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto">
<title id="title">P-02-001 · Concepto neumático / Pneumatic concept</title>
<desc id="desc">Diagrama funcional bilingüe de aire comprimido a dos funciones actuadas; válvulas, actuadores, escapes, aislamiento y estado energético permanecen sin definir.</desc>
<defs>
 <marker id="airArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#197c91"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#172536}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#56687a}.head{font-size:20px;font-weight:700}.body{font-size:16px;fill:#43576a}.small{font-size:14px;fill:#526476}.tiny{font-size:12px;fill:#526476}.tag{font-size:14px;font-weight:700;fill:#176d7e}.card{fill:#fff;stroke:#8395a3;stroke-width:2.5}.air{fill:none;stroke:#197c91;stroke-width:6;marker-end:url(#airArrow)}.branch{fill:none;stroke:#197c91;stroke-width:5}.dash{fill:none;stroke:#74899a;stroke-width:3;stroke-dasharray:8 7}.warning{fill:#fff4e8;stroke:#d38a43;stroke-width:2.5}
 </style>

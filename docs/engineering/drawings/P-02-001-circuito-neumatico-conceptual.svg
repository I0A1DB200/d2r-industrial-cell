<!-- clarifications -->
<rect x="94" y="692" width="1250" height="82" rx="12" class="warning"/><text x="119" y="723" class="head">Antes de detallar / Before detailing</text><text x="119" y="746" class="body">Elegir circuito y actuadores; cerrar puertos, válvula(s), escapes/silenciadores, caudal, presión dinámica y pérdida de energía.</text><text x="119" y="766" class="small">Select circuit and actuators; define ports, valve(s), exhaust/silencers, flow, dynamic pressure, and energy-loss response.</text>

<!-- sensors and safety boundary -->
<rect x="94" y="794" width="584" height="60" rx="12" fill="#edf6f8" stroke="#9db8c3" stroke-width="2"/><text x="115" y="820" class="tag">Tags del prototipo / prototype tags</text><text x="115" y="843" class="small">DI_MagazinePart · DI_PusherRetracted · DI_PusherExtended · ubicaciones TBD</text>
<rect x="760" y="794" width="584" height="60" rx="12" fill="#f2f3f5" stroke="#7f8b96" stroke-width="2" stroke-dasharray="8 6"/><text x="781" y="820" class="head">Safety / límite independiente</text><text x="781" y="843" class="small">Evaluación pendiente; no se selecciona válvula ni estado por pérdida de energía.</text>
<text x="64" y="882" class="tiny">Sin símbolos ISO 1219 de válvula: función, configuración y estado no están definidos. No se ha medido caudal/presión ni validado ningún circuito.</text>

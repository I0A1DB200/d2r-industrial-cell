<text x="64" y="74" class="title">P-02-001 · Concepto neumático</text><text x="64" y="104" class="subtitle">Pneumatic concept · esquema funcional / functional sketch · componentes por seleccionar</text>
<rect x="1035" y="46" width="340" height="44" rx="10" fill="#fff2e6" stroke="#ed7e27" stroke-width="2"/><text x="1205" y="75" text-anchor="middle" font-size="17" font-weight="700" fill="#9c4b0b">CONCEPTUAL · NO CONECTAR</text>
<line x1="54" y1="126" x2="1384" y2="126" stroke="#d8e0e6" stroke-width="2"/>
<text x="72" y="163" class="small">DOS FUNCIONES GRÁFICAS DEL SIMULADOR · SIN DIMENSIONAMIENTO DE AIRE</text><text x="1365" y="163" text-anchor="end" class="tiny">TWO SIMULATOR FUNCTIONS · NO AIR-SYSTEM SIZING</text>

<!-- supply -->
<rect x="72" y="231" width="230" height="124" rx="14" class="card"/><text x="187" y="269" text-anchor="middle" class="head">Aire de planta</text><text x="187" y="299" text-anchor="middle" class="body">Plant air supply</text><text x="187" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#197c91">6 bar nominal · SUPUESTO</text><text x="187" y="349" text-anchor="middle" class="tiny">6 bar nominal · ASSUMED, not measured</text>
<rect x="384" y="231" width="278" height="124" rx="14" class="card"/><text x="523" y="269" text-anchor="middle" class="head">Preparación + aislamiento</text><text x="523" y="299" text-anchor="middle" class="body">Air prep + isolation</text><text x="523" y="329" text-anchor="middle" class="small">Filtro/regulación por especificar</text><text x="523" y="349" text-anchor="middle" class="small">Filter/regulator to be specified</text>
<rect x="760" y="231" width="278" height="124" rx="14" class="card"/><text x="899" y="269" text-anchor="middle" class="head">Distribución de aire</text><text x="899" y="299" text-anchor="middle" class="body">Air distribution</text><text x="899" y="329" text-anchor="middle" class="small">Caudal, tubería y colector TBD</text><text x="899" y="349" text-anchor="middle" class="small">Flow, tubing and manifold TBD</text>
<path d="M302 293 H384" class="air"/><path d="M662 293 H760" class="air"/>

